name: test

on:
  push:
    branches:
      - dev
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { target: x86_64-pc-windows-msvc, os: windows-latest, features: servo }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, features: "servo,x11" }
          - { target: aarch64-apple-darwin, os: macos-latest, features: servo }
          - { target: aarch64-apple-ios, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-linux-android, os: ubuntu-latest }
        features:
          - {
              args: --no-default-features --features os-webview,
              key: no-default,
            }
          - {
              args: --no-default-features --features devtools,linux-body,mac-proxy,os-webview,serde,tracing,x11,
              key: native-all,
            }

    runs-on: ${{ matrix.platform.os }}

    steps:
      - uses: actions/checkout@v4
      - name: install stable
        uses: dtolnay/rust-toolchain@1.77
        with:
          targets: ${{ matrix.platform.target }}

      - name: install webkit2gtk (ubuntu only)
        if: contains(matrix.platform.target, 'gnu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: install webview2 (windows only)
        if: contains(matrix.platform.target, 'windows')
        shell: pwsh
        run: |
          Invoke-WebRequest https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile installwebview.exe -UseBasicParsing
          cmd /C start /wait installwebview.exe /silent /install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ matrix.features.key == 'native-all' }}

      - name: build wry
        run: cargo build --target ${{ matrix.platform.target }} ${{ matrix.features.args }}

      - name: build tests and examples
        shell: bash
        if: (!contains(matrix.platform.target, 'android') && !contains(matrix.platform.target, 'ios'))
        run: cargo test --no-run --verbose --target ${{ matrix.platform.target }} ${{ matrix.features.args }}

      - name: run tests
        if: (!contains(matrix.platform.target, 'android') && !contains(matrix.platform.target, 'ios'))
        run: cargo test --verbose --target ${{ matrix.platform.target }} --features linux-body ${{ matrix.features.args }}

      - name: install nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.platform.target }}
          components: miri

      - name: Run tests with miri
        if: (!contains(matrix.platform.target, 'android') && !contains(matrix.platform.target, 'ios'))
        run: cargo +nightly miri test --verbose --target ${{ matrix.platform.target }} --features linux-body ${{ matrix.features.args }}

  servo:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }

    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: install Servo build dependencies (ubuntu only)
        if: contains(matrix.platform.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libegl1-mesa-dev libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libx11-dev libxkbcommon-x11-dev lld
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"

      - name: install Servo toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: servo-${{ matrix.platform.target }}

      - name: test Servo backend
        run: cargo test --locked --lib --target ${{ matrix.platform.target }} --no-default-features --features ${{ matrix.platform.features }}

      - name: build Servo example
        run: cargo build --locked --example servo --target ${{ matrix.platform.target }} --no-default-features --features ${{ matrix.platform.features }}

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: install webkit2gtk
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev
      - name: Run cargo doc with each targets
        env:
          DOCS_RS: true
        run: |
          set -ex

          md="$(cargo metadata --format-version=1 | jq '.packages[] | select(.name=="wry") | .metadata.docs.rs')"

          export RUSTDOCFLAGS="$(echo "$md" | jq -r '.["rustdoc-args"] | join(" ")')"
          export RUSTFLAGS="$(echo "$md" | jq -r '.["rustc-args"] | join(" ")')"

          features="$(echo "$md" | jq -r '.features | join(",")')"
          no_default_features=
          if [ "$(echo "$md" | jq '.["no-default-features"]')" = true ]; then
            no_default_features="--no-default-features"
          fi

          for target in $(echo "$md" | jq -r '.targets | join(" ")')
          do
            rustup target add "$target"
            cargo doc -p wry "$no_default_features" "--features=$features" "--target=$target"
          done
